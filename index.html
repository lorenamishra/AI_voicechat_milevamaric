<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lorena | AI chat</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6f3ec;
      --muted: #a8a49c;
      --line: rgba(246, 243, 236, .12);
      --panel: rgba(27, 29, 28, .82);
      --accent: #e6b86b;
      --accent-dark: #19130b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: #121413;
      font-family: Georgia, "Times New Roman", serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at 15% 10%, #39443b 0, transparent 34%),
                  radial-gradient(circle at 90% 90%, #493b27 0, transparent 30%);
      opacity: .72;
    }
    .shell { width: min(900px, 100%); margin: 0 auto; padding: 28px 18px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .eyebrow { margin: 0 0 6px; color: var(--accent); font: 700 11px/1.2 system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(34px, 7vw, 60px); font-weight: 400; line-height: .95; }
    .status { color: var(--muted); font: 13px system-ui, sans-serif; }
    .chat { min-height: 68vh; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(12px); }
    #messages { flex: 1; padding: 24px; overflow-y: auto; }
    .message { max-width: 76%; margin: 0 0 20px; animation: arrive .25s ease-out; }
    .message.user { margin-left: auto; text-align: right; }
    .label { margin-bottom: 6px; color: var(--muted); font: 700 11px system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    .bubble { display: inline-block; padding: 13px 16px; border: 1px solid var(--line); background: rgba(255,255,255,.045); font-size: 18px; line-height: 1.45; text-align: left; white-space: pre-wrap; }
    .user .bubble { border-color: rgba(230, 184, 107, .45); background: rgba(230, 184, 107, .12); }
    form { display: flex; gap: 10px; padding: 15px; border-top: 1px solid var(--line); }
    textarea { flex: 1; min-height: 52px; max-height: 140px; resize: vertical; padding: 14px; border: 1px solid var(--line); outline: none; background: rgba(0,0,0,.2); color: var(--ink); font: 17px Georgia, serif; }
    textarea:focus { border-color: var(--accent); }
    button { cursor: pointer; border: 0; padding: 0 20px; background: var(--accent); color: var(--accent-dark); font: 700 14px system-ui, sans-serif; }
    button:disabled { cursor: wait; opacity: .55; }
    .voice { min-width: 52px; padding: 0 14px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 20px; }
    .voice.listening { border-color: var(--accent); background: rgba(230, 184, 107, .16); color: var(--accent); }
    .voice:disabled { cursor: not-allowed; }
    .clear { border: 1px solid var(--line); padding: 8px 12px; background: transparent; color: var(--muted); font-size: 12px; }
    .clear:hover { color: var(--ink); border-color: var(--accent); }
    @keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    @media (max-width: 560px) { header { align-items: start; } .message { max-width: 90%; } #messages { padding: 18px 14px; } form { padding: 10px; } button { padding: 0 14px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><p class="eyebrow">Private local chat</p><h1>Lorena</h1></div>
      <div><p class="status">Online</p><button class="clear" id="clear" type="button">Clear chat</button></div>
    </header>
    <section class="chat" aria-label="Chat with Lorena">
      <div id="messages"><div class="message"><div class="label">Lorena</div><div class="bubble">Hello. What would you like to talk about?</div></div></div>
      <form id="chat-form"><textarea id="message" placeholder="Write a message..." aria-label="Message" autofocus></textarea><button class="voice" id="voice" type="button" aria-label="Speak your message" title="Speak your message">&#127908;</button><button id="send" type="submit">Send</button></form>
    </section>
  </main>
  <script>
    const form = document.querySelector("#chat-form");
    const input = document.querySelector("#message");
    const messages = document.querySelector("#messages");
    const send = document.querySelector("#send");
    const voice = document.querySelector("#voice");
    const clear = document.querySelector("#clear");
    let recorder;
    let audioChunks = [];
    if (navigator.mediaDevices && window.MediaRecorder) {
      voice.addEventListener("click", async () => {
        if (recorder && recorder.state === "recording") {
          recorder.stop();
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioChunks = [];
          recorder = new MediaRecorder(stream);
          recorder.ondataavailable = (event) => audioChunks.push(event.data);
          recorder.onstart = () => {
            voice.classList.add("listening");
            voice.textContent = "...";
            voice.setAttribute("aria-label", "Stop listening");
          };
          recorder.onstop = async () => {
            stream.getTracks().forEach((track) => track.stop());
            voice.classList.remove("listening");
            voice.innerHTML = "&#127908;";
            voice.setAttribute("aria-label", "Speak your message");
            const data = new FormData();
            data.append("audio", new Blob(audioChunks, { type: recorder.mimeType }), "voice.webm");
            try {
              const response = await fetch("/transcribe", { method: "POST", body: data });
              const result = await response.json();
              if (!response.ok) throw new Error(result.error || "Transcription failed.");
              if (!result.text) throw new Error("No speech was detected. Try speaking closer to the microphone.");
              input.value = result.text;
              form.requestSubmit();
            } catch (error) {
              addMessage("System", error.message, "assistant");
            }
          };
          recorder.start();
        } catch (error) {
          addMessage("System", "Microphone access was blocked. Allow microphone access and try again.", "assistant");
        }
      });
    } else {
      voice.disabled = true;
      voice.title = "Local voice input is not supported in this browser";
      voice.setAttribute("aria-label", "Local voice input is not supported in this browser");
    }

    function addMessage(label, text, kind) {
      const message = document.createElement("div");
      message.className = `message ${kind || ""}`;
      message.innerHTML = `<div class="label"></div><div class="bubble"></div>`;
      message.querySelector(".label").textContent = label;
      message.querySelector(".bubble").textContent = text;
      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;
      return message;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || send.disabled) return;
      addMessage("You", text, "user");
      input.value = "";
      send.disabled = true;
      send.textContent = "...";
      try {
        const response = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Something went wrong.");
        addMessage("Lorena", data.reply, "assistant");
      } catch (error) {
        addMessage("System", error.message, "assistant");
      } finally {
        send.disabled = false;
        send.textContent = "Send";
        input.focus();
      }
    });

    clear.addEventListener("click", () => {
      messages.innerHTML = "";
      addMessage("Lorena", "Fresh start. What is on your mind?", "assistant");
      input.focus();
    });
  </script>
</body>
</html>
